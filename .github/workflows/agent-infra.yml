name: Agent infrastructure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "issue/**"
      - "codex/**"

permissions:
  contents: read
  pull-requests: read

# Supersede older checks without push/PR events cancelling one another.
concurrency:
  group: agent-infra-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  agent-infra:
    name: Agent infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks for this event
        id: scope
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { infrastructureChecksRequired } = require('./scripts/agent/ci_scope.js');
            core.setOutput('run_checks', await infrastructureChecksRequired({ github, context, core }));

      - name: Run Python unit tests
        if: steps.scope.outputs.run_checks == 'true'
        run: python3 -m unittest discover -s tests -v

      - name: Run mocked task PR workflow tests
        if: steps.scope.outputs.run_checks == 'true'
        run: node --test tests/auto_task_pr.test.js tests/ci_scope.test.js

      - name: Compile agent scripts and tests
        if: steps.scope.outputs.run_checks == 'true'
        run: >-
          python3 -m py_compile
          scripts/agent/closeout_gate.py
          scripts/agent/notify_task.py
          scripts/agent/pre_tool_guard.py
          scripts/agent/eval_harness.py
          scripts/agent/check_governance.py
          tests/test_notify_task.py
          tests/test_closeout_gate.py
          tests/test_pre_tool_guard.py
          tests/test_eval_harness.py
          tests/test_governance_check.py

      - name: Check runtime and artifact governance
        if: steps.scope.outputs.run_checks == 'true'
        run: python3 scripts/agent/check_governance.py

      - name: Parse Codex hook configuration
        if: steps.scope.outputs.run_checks == 'true'
        run: python3 -m json.tool .codex/hooks.json > /dev/null

      - name: Check diff and local documentation links
        if: steps.scope.outputs.run_checks == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE_SHA="$PR_BASE_SHA"
            DIFF_HEAD_SHA="$PR_HEAD_SHA"
          else
            DIFF_BASE_SHA="$(git merge-base origin/main HEAD)"
            DIFF_HEAD_SHA="HEAD"
          fi
          git diff --check "$DIFF_BASE_SHA" "$DIFF_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re

          documents = (
              Path("AGENTS.md"),
              Path("docs/setup/codex.md"),
              Path("docs/README.md"),
              Path("docs/engineering/README.md"),
              Path("docs/engineering/model_integrity.md"),
              Path("docs/research/issue46_omnipicker_model_integrity_cleanup_manifest.md"),
              Path("docs/engineering/runtime.md"),
              Path("docs/engineering/validation.md"),
              Path("scripts/research/README.md"),
              Path("docs/checklists/agent_infra_eval.md"),
              Path("docs/workflows/agent_behavior_eval.md"),
          )
          missing = []
          for document in documents:
              text = document.read_text(encoding="utf-8")
              for target in re.findall(r"\[[^]]+\]\(([^)]+)\)", text):
                  if target.startswith(("https://", "http://", "mailto:", "#")):
                      continue
                  path = target.split("#", 1)[0]
                  if path and not (document.parent / path).resolve().exists():
                      missing.append(f"{document}: {target}")
          if missing:
              raise SystemExit("Missing local Markdown targets: " + ", ".join(missing))
          print("Local Markdown links passed")
          PY
