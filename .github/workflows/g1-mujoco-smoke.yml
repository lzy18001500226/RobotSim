name: G1 MuJoCo smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "issue/**"
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

# Share the group across push/PR events and supersede older checks on this branch.
concurrency:
  group: g1-mujoco-smoke-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  g1-mujoco-smoke:
    name: Headless G1 model and stepping test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run clean headless smoke test
        run: ./scripts/run_g1_mujoco_smoke.sh
