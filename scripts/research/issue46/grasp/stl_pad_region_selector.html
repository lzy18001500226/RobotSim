<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>OmniPicker 完整包胶块高亮审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a23;color:#edf5f8;font:14px system-ui,sans-serif;overflow:hidden}
#ui{position:fixed;z-index:2;inset:0 auto 0 0;width:330px;padding:20px;background:#142734;overflow:auto;border-right:1px solid #3b5566}
h1{font-size:20px;margin:0 0 12px;line-height:1.4}p{line-height:1.5}.muted{color:#b7cad6;font-size:12px}.orange{color:#ffad58}.cyan{color:#70e9f2}
button{padding:9px;margin:4px 3px 2px 0;background:#274b60;color:#f4fbff;border:1px solid #5f8195;border-radius:7px;cursor:pointer}button:hover{background:#3b6680}
label{display:block;margin:12px 0 6px}input[type=range]{width:100%;accent-color:#64cef1}#info{white-space:pre-wrap;line-height:1.6;font:12px ui-monospace,monospace;padding:12px;background:#0e1d27;border-radius:7px;margin-top:15px}
#status{background:#334134;color:#eff3bc;padding:10px;border-radius:7px}#view{position:fixed;left:330px;top:0;right:0;bottom:0}canvas{display:block;width:100%;height:100%}.badge{display:inline-block;border:1px solid #71899a;padding:4px 8px;border-radius:5px;font-size:12px}
@media(max-width:700px){#ui{width:270px;padding:12px}#view{left:270px}h1{font-size:17px}}
</style></head>
<body><aside id="ui">
<span class="badge">仅包胶区域视觉审核</span><h1>两块完整包胶候选区域<br>已经默认高亮</h1>
<p><span class="orange">橙色：窄侧包胶块</span><br><span class="cyan">青色：宽侧包胶块</span></p>
<p class="muted">请检查颜色是否覆盖整块包胶：纹理正面、弯下去的下半段、两侧和顶部封口。灰色为其余结构。</p>
<label for="command">夹爪开合：<b id="commandValue">26</b>%</label><input id="command" type="range" min="0" max="100" step="1" value="26">
<div><button data-command="0">闭合 0%</button><button data-command="50">50%</button><button data-command="100">张开 100%</button></div>
<p>查看角度</p><div><button data-view="oblique">斜视</button><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="bottom">底部</button><button data-view="side">侧面</button></div>
<div><button id="isolate">只看两块高亮面</button><button id="wire">三角网格</button></div>
<p id="status">正在加载高亮区域…</p><div id="info"></div>
<p class="muted">左键拖动旋转，右键平移，滚轮缩放。滑块覆盖 0–100%。颜色表示本次提取区域，等待你的视觉确认。材质边界及封闭性尚未认证。</p>
<p class="muted">本页不计算圆、不运行动力学。官方 STL、关节与碰撞模型保持原样。</p>
</aside><main id="view"></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>/*__SCENE_DATA__*/</script>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const viewport=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color('#101a23');
const camera=new T.PerspectiveCamera(43,1,.001,50);camera.up.set(0,0,1);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));viewport.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new T.HemisphereLight(0xf3faff,0x293b4b,2.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(2,-2,4);scene.add(light);
let command=26,isolate=false,wire=false,data;const entries=[];const neutral=new T.Color('#8196a6');
function transform(object,pose,id){const r=pose.rotation[id],p=pose.position[id];object.matrix.set(r[0],r[1],r[2],p[0],r[3],r[4],r[5],p[1],r[6],r[7],r[8],p[2],0,0,0,1);object.matrixWorldNeedsUpdate=true}
function geometry(mesh,faceIds,color){const vertices=[],colors=[];for(const f of faceIds){for(let corner=0;corner<3;corner++){const i=mesh.faces[f*3+corner]*3;vertices.push(mesh.vertices[i],mesh.vertices[i+1],mesh.vertices[i+2]);colors.push(color.r,color.g,color.b)}}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vertices,3));g.setAttribute('color',new T.Float32BufferAttribute(colors,3));g.computeVertexNormals();return g}
function material(){return new T.MeshStandardMaterial({vertexColors:true,roughness:.7,side:T.DoubleSide})}
function update(){const pose=data.poses[command];for(const e of entries){transform(e.object,pose,e.id);e.object.visible=!(isolate&&e.structure);e.object.material.wireframe=wire}document.querySelector('#commandValue').textContent=command;document.querySelector('#status').textContent='高亮已完成 · 请审核完整范围';document.querySelector('#info').textContent=Object.entries(data.pads).map(([body,pad])=>`${body.includes('narrow')?'窄侧（橙色）':'宽侧（青色）'}\n高亮三角形：${pad.shell_review.complete_highlight_triangles}\n人工种子面：${pad.shell_review.seed_source_face}\n区域状态：等待视觉确认`).join('\n\n')}
function center(){const box=new T.Box3();for(const e of entries){if(!e.structure){e.object.updateMatrixWorld(true);box.expandByObject(e.object)}}return box.getCenter(new T.Vector3())}
function setView(view){const c=center(),offset={oblique:[.18,-.16,.10],front:[.25,0,.005],back:[-.25,0,.005],bottom:[.015,0,-.25],side:[.02,-.25,.015]}[view];controls.target.copy(c);camera.position.copy(c).add(new T.Vector3(...offset));controls.update()}
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
try{
 data=window.SCENE_DATA;if(!data)throw Error('缺少场景数据');
 const byGeom=new Map(Object.entries(data.pads).map(([name,p])=>[String(p.geom),{name,p}]));
 for(const geom of data.geoms){const mesh=data.meshes[String(geom.mesh)],pad=byGeom.get(String(geom.id)),allFaces=Array.from({length:mesh.faces.length/3},(_,i)=>i);let rest=allFaces;
  if(pad){const ids=pad.p.shell_review.source_face_indices,chosen=new Set(ids);rest=allFaces.filter(i=>!chosen.has(i));const color=new T.Color(pad.name.includes('narrow')?'#ff972c':'#35e3ef');const object=new T.Mesh(geometry(mesh,ids,color),material());object.matrixAutoUpdate=false;scene.add(object);entries.push({id:String(geom.id),object,structure:false})}
  const object=new T.Mesh(geometry(mesh,rest,neutral),material());object.matrixAutoUpdate=false;scene.add(object);entries.push({id:String(geom.id),object,structure:true});
 }
 document.querySelector('#command').oninput=e=>{command=+e.target.value;update()};for(const b of document.querySelectorAll('[data-command]'))b.onclick=()=>{command=+b.dataset.command;document.querySelector('#command').value=command;update()};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>setView(b.dataset.view);
 document.querySelector('#isolate').onclick=()=>{isolate=!isolate;document.querySelector('#isolate').textContent=isolate?'显示其余结构':'只看两块高亮面';update()};document.querySelector('#wire').onclick=()=>{wire=!wire;update()};resize();update();setView('oblique');
}catch(error){document.querySelector('#status').textContent='加载失败：'+error.message;console.error(error)}
addEventListener('resize',resize);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
